name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Zavisnosti (stvarno razresene verzije; poznata ranjivost obara build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore LustreRadio.slnx
          if ($LASTEXITCODE -ne 0) { throw 'restore nije uspeo (ranjivosti NU1901-NU1904 su greske)' }
          Write-Host '--- lanac do SQLite-a ---'
          dotnet nuget why src/LustreRadio.Data/LustreRadio.Data.csproj SQLitePCLRaw.lib.e_sqlite3
          Write-Host '--- svi paketi projekta Data, i posredni ---'
          dotnet list src/LustreRadio.Data/LustreRadio.Data.csproj package --include-transitive
          Write-Host '--- provera ranjivosti, cela solucija, i posredni paketi ---'
          $report = (dotnet list LustreRadio.slnx package --vulnerable --include-transitive 2>&1 | Out-String)
          Write-Host $report
          if ($LASTEXITCODE -ne 0) { throw 'provera ranjivosti nije uspela' }
          if ($report -match 'has the following vulnerable packages') { throw 'PRONADJEN RANJIV PAKET' }
          if ($report -notmatch 'no vulnerable packages') { throw 'provera ranjivosti nije dala ocekivan izvestaj' }
      - name: Build
        run: dotnet build LustreRadio.slnx -c Release --no-restore
      - name: Test
        run: dotnet test LustreRadio.slnx -c Release --no-build --logger "console;verbosity=detailed"
      - name: Smoke (programi se pokrecu i pisu log)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tfm = 'bin\Release\net10.0-windows'
          $runs = @(
            @{ exe = "src\LustreRadio.Engine\$tfm\LustreRadio.Engine.exe"; args = @('--smoke'); log = 'engine' },
            @{ exe = "src\LustreRadio.UI\$tfm\LustreRadio.UI.exe"; args = @('--smoke'); log = 'ui' }
          )
          foreach ($r in $runs) {
            if ($r.args.Count -gt 0) { $p = Start-Process $r.exe -ArgumentList $r.args -PassThru }
            else { $p = Start-Process $r.exe -PassThru }
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$($r.exe): nije zavrsio za 60 s" }
            if ($p.ExitCode -ne 0) { throw "$($r.exe): izlazni kod $($p.ExitCode)" }
            $logs = Get-ChildItem "$env:ProgramData\LustreRadio\logs\$($r.log)-*.log"
            if (-not $logs) { throw "$($r.log): nema log fajla" }
            Get-Content $logs[0].FullName | Select-Object -Last 1
          }
          & "src\LustreRadio.Bench\$tfm\LustreRadio.Bench.exe" --auto; if ($LASTEXITCODE -ne 0) { throw 'Bench' }
          & "src\LustreRadio.Analyzer\$tfm\LustreRadio.Analyzer.exe" @(Get-ChildItem testdata\audio -Exclude *.opus | ForEach-Object FullName); if ($LASTEXITCODE -ne 0) { throw 'Analyzer' }
          & "src\LustreRadio.Proba\$tfm\LustreRadio.Proba.exe" --auto; if ($LASTEXITCODE -ne 0) { throw 'Proba' }
      - name: Ekrani (slike i provera velicine kontrola)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process "src\LustreRadio.UI\bin\Release\net10.0-windows\LustreRadio.UI.exe" -ArgumentList '--snapshot', "$PWD\snapshots" -PassThru -RedirectStandardError snapshot-err.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'snapshot nije zavrsio' }
          Get-Content snapshot-err.txt
          Get-ChildItem "$env:ProgramData\LustreRadio\logs\ui-*.log" | ForEach-Object { Get-Content $_.FullName -Tail 30 }
          if ($p.ExitCode -ne 0) { throw "Provera ekrana: izlazni kod $($p.ExitCode)" }
          Get-ChildItem snapshots\*-1366x768.jpg, snapshots\01-*-1024x600.jpg, snapshots\08-*-1024x600.jpg | ForEach-Object {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 4000) { Write-Host ("IMG|{0}|{1}" -f $_.BaseName, $b.Substring($i, [Math]::Min(4000, $b.Length - $i))) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio-Ekrani
          path: snapshots/*.png
          retention-days: 30
      - name: Paket (svi programi u jednom folderu)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in 'Engine', 'Watchdog', 'UI') {
            dotnet publish "src/LustreRadio.$p/LustreRadio.$p.csproj" -c Release -r win-x64 --self-contained true -o publish/LustreRadio
            if ($LASTEXITCODE -ne 0) { throw "publish $p" }
          }
      - name: Objavljeni paket (bez skrivenih prekidaca; verzija SQLite-a u samom fajlu)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Resolve-Path publish/LustreRadio).Path
          $ours = Get-ChildItem $pkg -Filter 'LustreRadio.*' -File
          if ($ours.Count -lt 10) { throw "premalo nasih fajlova u paketu: $($ours.Count)" }
          foreach ($file in $ours) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            $views = @([Text.Encoding]::Latin1.GetString($bytes), [Text.Encoding]::Unicode.GetString($bytes), [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1))
            foreach ($needle in 'LUSTRE_TEST_', 'LUSTRE_DATA_ROOT', 'ALLOW_SESSION0') {
              foreach ($view in $views) { if ($view.Contains($needle)) { throw "$($file.Name) sadrzi '$needle'" } }
            }
          }
          Write-Host "Pregledano $($ours.Count) nasih fajlova: nema teksta LUSTRE_TEST_, LUSTRE_DATA_ROOT, ALLOW_SESSION0."
          $dll = Join-Path $pkg 'e_sqlite3.dll'
          if (-not (Test-Path $dll)) { throw 'u paketu nema e_sqlite3.dll' }
          Add-Type -Namespace Native -Name Sq -MemberDefinition '[DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)] public static extern IntPtr LoadLibraryW(string path); [DllImport("e_sqlite3", CallingConvention = CallingConvention.Cdecl)] public static extern IntPtr sqlite3_libversion();'
          if ([Native.Sq]::LoadLibraryW($dll) -eq [IntPtr]::Zero) { throw 'e_sqlite3.dll ne moze da se ucita' }
          $version = [Runtime.InteropServices.Marshal]::PtrToStringAnsi([Native.Sq]::sqlite3_libversion())
          Write-Host ("REZULTAT | SQLite u fajlu publish/LustreRadio/e_sqlite3.dll | {0} | SHA-256 {1}" -f $version, (Get-FileHash $dll -Algorithm SHA256).Hash.Substring(0, 16))
          if ([version]$version -lt [version]'3.50.2') { throw "ranjiv SQLite u paketu: $version" }
      - name: Nadzor (integracioni test sa pravim procesima)
        shell: pwsh
        timeout-minutes: 14
        run: ./tests/integration/nadzor.ps1 -Bin (Resolve-Path publish/LustreRadio)
      - name: Paket za preuzimanje (radio sa interfejsom, proba)
        shell: pwsh
        run: Copy-Item packaging/proba/* publish/LustreRadio/
      - name: Trajno izdanje faze A (samo na granama izdanje-*)
        if: startsWith(github.ref_name, 'izdanje-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $code = 'bcb3eba264e42ae218cd28f92ee81cc0dad877b3'
          $changed = @(git diff --name-only $code HEAD -- src tests Directory.Build.props Directory.Packages.props LustreRadio.slnx)
          if ($changed.Count -gt 0) { throw "kod se razlikuje od faze A: $($changed -join ', ')" }
          Write-Host "Kod programa je isti kao u izmeni $code (grana stabilno-faza-a); razlika je samo u postupku izdanja."
          Add-Type -Namespace Native -Name Rel -MemberDefinition '[DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)] public static extern IntPtr LoadLibraryW(string path); [DllImport("e_sqlite3", CallingConvention = CallingConvention.Cdecl)] public static extern IntPtr sqlite3_libversion();'
          [void][Native.Rel]::LoadLibraryW((Resolve-Path publish/LustreRadio/e_sqlite3.dll).Path)
          $sqlite = [Runtime.InteropServices.Marshal]::PtrToStringAnsi([Native.Rel]::sqlite3_libversion())
          $text = @(
            'LUSTRE RADIO - stabilna verzija faze A',
            'Verzija: 0.1.0, faza A',
            "Kod programa: izmena $code (grana stabilno-faza-a)",
            "Izdanje napravljeno iz izmene: $env:GITHUB_SHA (dodat samo postupak izdanja)",
            'Sema baze: 1',
            "SQLite: $sqlite",
            ('Napravljeno: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm') + ' UTC'),
            "GitHub Actions: pokretanje $env:GITHUB_RUN_ID"
          )
          Set-Content publish/LustreRadio/VERZIJA.txt $text -Encoding utf8
          Copy-Item packaging/izdanje/POVRATAK.txt publish/LustreRadio/
          New-Item -ItemType Directory -Force izdanje | Out-Null
          $zip = 'izdanje/LustreRadio-faza-a-0.1.0.zip'
          Compress-Archive -Path publish/LustreRadio/* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Set-Content "$zip.sha256.txt" "$hash  LustreRadio-faza-a-0.1.0.zip" -Encoding ascii
          Write-Host "REZULTAT | izdanje | $zip | SHA-256 $hash | $((Get-Item $zip).Length) bajtova"
          gh release view faza-a-0.1.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Izdanje faza-a-0.1.0 vec postoji; ne pravi se ponovo. Proverava se postojece.'
            gh release download faza-a-0.1.0 --repo $env:GITHUB_REPOSITORY --pattern '*.sha256.txt' --dir izdanje-staro --clobber
            Write-Host ('Postojece izdanje: ' + (Get-Content izdanje-staro/*.sha256.txt))
          } else {
            $notes = "Stabilna verzija faze A (0.1.0). Kod: izmena $code. Sema baze 1, SQLite $sqlite. Uputstvo za povratak: POVRATAK.txt u ZIP-u. SHA-256: $hash"
            gh release create faza-a-0.1.0 $zip "$zip.sha256.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'LUSTRE RADIO faza A 0.1.0' --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'izdanje nije napravljeno' }
          }
      - name: Provera izdanja (skidanje nazad, kontrolni zbir, pokretanje iz raspakovanog foldera)
        if: startsWith(github.ref_name, 'izdanje-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = Join-Path $env:RUNNER_TEMP 'izdanje-skinuto'
          gh release download faza-a-0.1.0 --repo $env:GITHUB_REPOSITORY --dir $dl --clobber
          if ($LASTEXITCODE -ne 0) { throw 'izdanje ne moze da se skine' }
          $zip = Join-Path $dl 'LustreRadio-faza-a-0.1.0.zip'
          $expected = ((Get-Content "$zip.sha256.txt") -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "kontrolni zbir se ne slaze: $expected / $actual" }
          Write-Host "REZULTAT | skinuto izdanje | SHA-256 se slaze | $actual"
          $dir = Join-Path $env:RUNNER_TEMP 'LustreRadio-faza-A'
          Expand-Archive $zip -DestinationPath $dir -Force
          foreach ($f in 'LustreRadio.Engine.exe', 'LustreRadio.Watchdog.exe', 'LustreRadio.UI.exe', 'POKRENI.cmd', 'ZAUSTAVI.cmd', 'VERZIJA.txt', 'POVRATAK.txt', 'e_sqlite3.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "u izdanju nema $f" }
          }
          Get-Content (Join-Path $dir 'VERZIJA.txt') | ForEach-Object { Write-Host "   $_" }
          Get-Process -Name 'LustreRadio.Watchdog', 'LustreRadio.Engine', 'LustreRadio.UI' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:ProgramData 'LustreRadio\stop.flag') -ErrorAction SilentlyContinue
          $start = Get-Date
          Start-Process (Join-Path $dir 'LustreRadio.Watchdog.exe')
          try {
            $engineExe = Join-Path $dir 'LustreRadio.Engine.exe'
            $limit = (Get-Date).AddSeconds(60); $engine = $null
            while (-not $engine -and (Get-Date) -lt $limit) {
              $engine = Get-Process -Name 'LustreRadio.Engine' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $engineExe }
              Start-Sleep -Milliseconds 500
            }
            if (-not $engine) { throw 'Engine iz raspakovanog izdanja se nije pokrenuo' }
            Start-Sleep 5
            $logs = Join-Path $env:ProgramData 'LustreRadio\logs'
            $line = Get-ChildItem (Join-Path $logs 'engine-*.log') | ForEach-Object { Get-Content $_.FullName } |
              Where-Object { $_ -match '^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)' -and [datetime]::ParseExact($Matches[1], 'yyyy-MM-dd HH:mm:ss', $null) -ge $start.AddSeconds(-2) -and $_ -match 'Baza: SQLite' } | Select-Object -Last 1
            if ($line -notmatch 'sema 1') { throw "u dnevniku nema ocekivanog reda o bazi: $line" }
            Write-Host "   $line"
            Write-Host "REZULTAT | izdanje faze A se pokrece iz raspakovanog foldera | Engine $($engine.Id) | PASS"
          }
          finally {
            Start-Process (Join-Path $dir 'LustreRadio.Watchdog.exe') -ArgumentList '--stop' -Wait -ErrorAction SilentlyContinue
            Get-Process -Name 'LustreRadio.Watchdog', 'LustreRadio.Engine', 'LustreRadio.UI' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio
          path: publish/LustreRadio
          retention-days: 30
      - name: Paket za preuzimanje (Bench)
        run: dotnet publish src/LustreRadio.Bench/LustreRadio.Bench.csproj -c Release -r win-x64 --self-contained true -o publish/LustreRadio-Bench
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio-Bench
          path: publish/LustreRadio-Bench
          retention-days: 30
      - name: Paket za preuzimanje (Proba radija)
        run: dotnet publish src/LustreRadio.Proba/LustreRadio.Proba.csproj -c Release -r win-x64 --self-contained true -o publish/LustreRadio-Proba
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio-Proba
          path: publish/LustreRadio-Proba
          retention-days: 30
