name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Zavisnosti (stvarno razresene verzije; poznata ranjivost obara build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore LustreRadio.slnx
          if ($LASTEXITCODE -ne 0) { throw 'restore nije uspeo (ranjivosti NU1901-NU1904 su greske)' }
          Write-Host '--- lanac do SQLite-a ---'
          dotnet nuget why src/LustreRadio.Data/LustreRadio.Data.csproj SQLitePCLRaw.lib.e_sqlite3
          Write-Host '--- svi paketi projekta Data, i posredni ---'
          dotnet list src/LustreRadio.Data/LustreRadio.Data.csproj package --include-transitive
          Write-Host '--- provera ranjivosti, cela solucija, i posredni paketi ---'
          $report = (dotnet list LustreRadio.slnx package --vulnerable --include-transitive 2>&1 | Out-String)
          Write-Host $report
          if ($LASTEXITCODE -ne 0) { throw 'provera ranjivosti nije uspela' }
          if ($report -match 'has the following vulnerable packages') { throw 'PRONADJEN RANJIV PAKET' }
          if ($report -notmatch 'no vulnerable packages') { throw 'provera ranjivosti nije dala ocekivan izvestaj' }
      - name: Build
        run: dotnet build LustreRadio.slnx -c Release --no-restore
      - name: Test
        run: dotnet test LustreRadio.slnx -c Release --no-build --filter "Category!=Ogled" --logger "console;verbosity=detailed"
      - name: Smoke (programi se pokrecu i pisu log)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tfm = 'bin\Release\net10.0-windows'
          $runs = @(
            @{ exe = "src\LustreRadio.Engine\$tfm\LustreRadio.Engine.exe"; args = @('--smoke'); log = 'engine' },
            @{ exe = "src\LustreRadio.UI\$tfm\LustreRadio.UI.exe"; args = @('--smoke'); log = 'ui' }
          )
          foreach ($r in $runs) {
            if ($r.args.Count -gt 0) { $p = Start-Process $r.exe -ArgumentList $r.args -PassThru }
            else { $p = Start-Process $r.exe -PassThru }
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$($r.exe): nije zavrsio za 60 s" }
            if ($p.ExitCode -ne 0) { throw "$($r.exe): izlazni kod $($p.ExitCode)" }
            $logs = Get-ChildItem "$env:ProgramData\LustreRadio\logs\$($r.log)-*.log"
            if (-not $logs) { throw "$($r.log): nema log fajla" }
            Get-Content $logs[0].FullName | Select-Object -Last 1
          }
          & "src\LustreRadio.Bench\$tfm\LustreRadio.Bench.exe" --auto; if ($LASTEXITCODE -ne 0) { throw 'Bench' }
          & "src\LustreRadio.Analyzer\$tfm\LustreRadio.Analyzer.exe" @(Get-ChildItem testdata\audio -Exclude *.opus | ForEach-Object FullName); if ($LASTEXITCODE -ne 0) { throw 'Analyzer' }
          & "src\LustreRadio.Proba\$tfm\LustreRadio.Proba.exe" --auto; if ($LASTEXITCODE -ne 0) { throw 'Proba' }
      - name: Ekrani (slike i provera velicine kontrola)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process "src\LustreRadio.UI\bin\Release\net10.0-windows\LustreRadio.UI.exe" -ArgumentList '--snapshot', "$PWD\snapshots" -PassThru -RedirectStandardError snapshot-err.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'snapshot nije zavrsio' }
          Get-Content snapshot-err.txt
          Get-ChildItem "$env:ProgramData\LustreRadio\logs\ui-*.log" | ForEach-Object { Get-Content $_.FullName -Tail 30 }
          if ($p.ExitCode -ne 0) { throw "Provera ekrana: izlazni kod $($p.ExitCode)" }
          Get-ChildItem snapshots\*-1366x768.jpg, snapshots\01-*-1024x600.jpg, snapshots\08-*-1024x600.jpg | ForEach-Object {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 4000) { Write-Host ("IMG|{0}|{1}" -f $_.BaseName, $b.Substring($i, [Math]::Min(4000, $b.Length - $i))) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio-Ekrani
          path: snapshots/*.png
          retention-days: 30
      - name: Paket (svi programi u jednom folderu)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in 'Engine', 'Watchdog', 'UI') {
            dotnet publish "src/LustreRadio.$p/LustreRadio.$p.csproj" -c Release -r win-x64 --self-contained true -o publish/LustreRadio
            if ($LASTEXITCODE -ne 0) { throw "publish $p" }
            $rc = Get-Content "publish/LustreRadio/LustreRadio.$p.runtimeconfig.json" -Raw | ConvertFrom-Json
            if ($rc.runtimeOptions.configProperties.'System.GC.Concurrent' -ne $false) { throw "${p}: concurrent GC nije iskljucen (spec. 3.4)" }
            $pe = [System.Reflection.PortableExecutable.PEReader]::new([System.IO.File]::OpenRead((Resolve-Path "publish/LustreRadio/LustreRadio.$p.dll")))
            $r2r = ($pe.PEHeaders.CorHeader.ManagedNativeHeaderDirectory.Size -gt 0); $pe.Dispose()
            if (-not $r2r) { throw "${p}: nije ReadyToRun (spec. 3.4)" }
            Write-Host "REZULTAT | spec. 3.4 | LustreRadio.$p | concurrent GC iskljucen, ReadyToRun | PASS"
          }
      - name: Objavljeni paket (bez skrivenih prekidaca; verzija SQLite-a u samom fajlu)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Resolve-Path publish/LustreRadio).Path
          $ours = Get-ChildItem $pkg -Filter 'LustreRadio.*' -File
          if ($ours.Count -lt 10) { throw "premalo nasih fajlova u paketu: $($ours.Count)" }
          foreach ($file in $ours) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            $views = @([Text.Encoding]::Latin1.GetString($bytes), [Text.Encoding]::Unicode.GetString($bytes), [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1))
            foreach ($needle in 'LUSTRE_TEST_', 'LUSTRE_DATA_ROOT', 'ALLOW_SESSION0') {
              foreach ($view in $views) { if ($view.Contains($needle)) { throw "$($file.Name) sadrzi '$needle'" } }
            }
          }
          Write-Host "Pregledano $($ours.Count) nasih fajlova: nema teksta LUSTRE_TEST_, LUSTRE_DATA_ROOT, ALLOW_SESSION0."
          if (Get-ChildItem $pkg -Filter 'LustreRadio.Sim*' -File) { throw 'simulacija (LustreRadio.Sim) ne sme da bude u paketu' }
          if (Get-ChildItem $pkg -Filter 'LustreRadio.CrashProbe*' -File) { throw 'proba pada (LustreRadio.CrashProbe) ne sme da bude u paketu' }
          Write-Host 'Simulacija (LustreRadio.Sim) nije u paketu.'
          $dll = Join-Path $pkg 'e_sqlite3.dll'
          if (-not (Test-Path $dll)) { throw 'u paketu nema e_sqlite3.dll' }
          Add-Type -Namespace Native -Name Sq -MemberDefinition '[DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)] public static extern IntPtr LoadLibraryW(string path); [DllImport("e_sqlite3", CallingConvention = CallingConvention.Cdecl)] public static extern IntPtr sqlite3_libversion();'
          if ([Native.Sq]::LoadLibraryW($dll) -eq [IntPtr]::Zero) { throw 'e_sqlite3.dll ne moze da se ucita' }
          $version = [Runtime.InteropServices.Marshal]::PtrToStringAnsi([Native.Sq]::sqlite3_libversion())
          Write-Host ("REZULTAT | SQLite u fajlu publish/LustreRadio/e_sqlite3.dll | {0} | SHA-256 {1}" -f $version, (Get-FileHash $dll -Algorithm SHA256).Hash.Substring(0, 16))
          if ([version]$version -lt [version]'3.50.2') { throw "ranjiv SQLite u paketu: $version" }
      - name: Nadzor (integracioni test sa pravim procesima)
        shell: pwsh
        timeout-minutes: 14
        run: ./tests/integration/nadzor.ps1 -Bin (Resolve-Path publish/LustreRadio)
      - name: Baza - nadogradnja, rad bez nadogradnje, povratak na fazu A (B1; G)
        shell: pwsh
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item packaging/proba/* publish/LustreRadio/
          $dl = Join-Path $env:RUNNER_TEMP 'faza-a-izdanje'
          gh release download faza-a-0.1.0 --repo $env:GITHUB_REPOSITORY --dir $dl --clobber
          if ($LASTEXITCODE -ne 0) { throw 'izdanje faze A ne moze da se skine' }
          $zip = Join-Path $dl 'LustreRadio-faza-a-0.1.0.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'B3720562D8D462FBE759B28485D39673E7D650FBAFCC71144BF51173FD53E2B9') { throw 'kontrolni zbir izdanja faze A se ne slaze' }
          $phaseA = Join-Path $env:RUNNER_TEMP 'faza-a'
          Expand-Archive $zip -DestinationPath $phaseA -Force
          ./tests/integration/baza.ps1 -Bin (Resolve-Path publish/LustreRadio) -PhaseA $phaseA -Fixture (Resolve-Path testdata/db/sema1-sqlite-3.46.1.db)
      - name: Memorija objavljenih programa (B-101, B-102, B-103; G, bez zvuka)
        shell: pwsh
        timeout-minutes: 9
        run: ./tests/integration/memorija.ps1 -Bin (Resolve-Path publish/LustreRadio)
      - name: Paket za preuzimanje (radio sa interfejsom, proba)
        shell: pwsh
        run: Copy-Item packaging/proba/* publish/LustreRadio/
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio
          path: publish/LustreRadio
          retention-days: 30
      - name: Paket za preuzimanje (Bench)
        run: dotnet publish src/LustreRadio.Bench/LustreRadio.Bench.csproj -c Release -r win-x64 --self-contained true -o publish/LustreRadio-Bench
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio-Bench
          path: publish/LustreRadio-Bench
          retention-days: 30
      - name: Paket za preuzimanje (Proba radija)
        run: dotnet publish src/LustreRadio.Proba/LustreRadio.Proba.csproj -c Release -r win-x64 --self-contained true -o publish/LustreRadio-Proba
      - uses: actions/upload-artifact@v4
        with:
          name: LustreRadio-Proba
          path: publish/LustreRadio-Proba
          retention-days: 30

  simulacija:
    # G-sim: simulacija slabog racunara. NIJE test na Celeronu N4000 niti sa Bluetooth zvucnikom.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build simulacije
        run: dotnet build tests/LustreRadio.Sim/LustreRadio.Sim.csproj -c Release
      - name: G-sim, faza B0 (merenje sadasnjeg stanja, bez kriterijuma)
        shell: pwsh
        run: |
          $exe = Get-ChildItem tests/LustreRadio.Sim/bin/Release -Recurse -Filter LustreRadio.Sim.exe | Select-Object -First 1
          & $exe.FullName --all --seconds 180 --out sim-rezultati
          if ($LASTEXITCODE -ne 0) { throw "simulacija: izlazni kod $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G-sim
          path: sim-rezultati

  ogledi:
    # Ogledi za pragove (plan faze B, 2.7: B-120, B-126, B-223). Rezultat je tabela; ne utice na prolaz.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ogledi
        shell: pwsh
        run: |
          dotnet test tests/LustreRadio.Audio.Tests/LustreRadio.Audio.Tests.csproj -c Release --filter "Category=Ogled" --logger "console;verbosity=detailed" | Tee-Object -FilePath ogledi.txt | Out-Null
          Select-String -Path ogledi.txt -Pattern 'OGLED|MERENJE' | ForEach-Object { $_.Line.Trim() }
